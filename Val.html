<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#14001f;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:'Poppins',sans-serif;
  background: radial-gradient(circle at top, #3f145f, var(--bg) 70%);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  text-align:center;
  overflow:hidden;
}

.container{
  width:100%;
  max-width:520px;
  padding:20px;
  position:relative;
  z-index:2;
}

/* BIG VIDEO */
.video-wrap{
  width:100%;
  max-height:70vh;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,0.6);
  margin-bottom:26px;
}

.video-wrap video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

/* IMAGE / GIF FOR RESULTS */
.image-wrap{
  width:100%;
  max-width:360px;
  height:420px;
  margin:0 auto 22px;
  border-radius:26px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,0.55);
  background:#000;
}

.image-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* BUTTONS */
.buttons{
  display:flex;
  justify-content:center;
  gap:22px;
  margin-top:18px;
}

.btn{
  padding:14px 38px;
  border-radius:999px;
  background:rgba(255,255,255,0.18);
  border:1px solid rgba(255,255,255,0.28);
  cursor:pointer;
  font-size:16px;
  font-weight:600;
  transition:.25s;
}

.btn:hover{
  transform:translateY(-3px) scale(1.05);
  box-shadow:0 20px 40px rgba(255,122,191,0.4);
}

/* RESULTS */
.result{display:none}

h1{
  font-family:'Playfair Display',serif;
  font-size:30px;
  margin:18px 0;
}

.small{
  font-size:14px;
  opacity:.8;
}

.try-again{
  margin-top:24px;
  text-decoration:underline;
  cursor:pointer;
}

/* CONFETTI / CRY EFFECT */
.effect{
  position:fixed;
  top:-10vh;
  font-size:26px;
  animation:fall linear forwards;
  z-index:1;
}

@keyframes fall{
  to{
    transform:translateY(120vh) rotate(360deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- QUESTION -->
  <div id="question">
    <div class="video-wrap">
      <video autoplay muted loop playsinline>
        <source src="propose.mp4" type="video/mp4">
      </video>
    </div>

    <h1>Pleasseeeeeeee be my Valentine foreverrr??</h1>

    <div class="buttons">
      <div class="btn" onclick="sayYes()">Yessssss</div>
      <div class="btn" onclick="sayNo()">Teriii tohhh</div>
    </div>
  </div>

  <!-- YES RESULT -->
  <div id="yesResult" class="result">
    <div class="image-wrap">
      <!-- HAPPY IMAGE / GIF -->
      <img src="Happy.jpg" alt="Happy moment">
    </div>
    <h1>You bring you the happy kid in mee cutuuu</h1>
    <p class="small">Thank you for choosing me, I can assure you I will not let you down. 💌</p>
  </div>

  <!-- NO RESULT -->
  <div id="noResult" class="result">
    <div class="image-wrap">
      <!-- SAD IMAGE / GIF -->
      <img src="Sad.jpg" alt="Sad moment">
    </div>
    <h1>Oh no 😭</h1>
    <p class="small">Do you reallly really want me to cry?????</p>
    <div class="try-again" onclick="tryAgain()">Pitayii ho jayegii chall firse try kar</div>
  </div>

</div>

<script>
function sayYes(){
  hideAll();
  document.getElementById('yesResult').style.display='block';
  rain("🎉","💕","✨","💖");
}

function sayNo(){
  hideAll();
  document.getElementById('noResult').style.display='block';
  rain("😭","💔","😢","🥺");
}

function tryAgain(){
  hideAll();
  document.getElementById('question').style.display='block';
}

function hideAll(){
  document.getElementById('question').style.display='none';
  document.getElementById('yesResult').style.display='none';
  document.getElementById('noResult').style.display='none';
}

function rain(...emojis){
  for(let i=0;i<90;i++){
    const el=document.createElement("div");
    el.className="effect";
    el.innerText=emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left=Math.random()*100+"vw";
    el.style.animationDuration=3+Math.random()*3+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),6000);
  }
}
</script>

</body>
</html>
